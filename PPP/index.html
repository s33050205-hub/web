<!DOCTYPE html>
<html>
     <head>
    <title>資三乙 5 蕭妤晴</title>
    <style>
    td {
         border: 3px solid rgb(118, 82, 165);
         border-style: dotted;

    }
    th, td {
  background-color: #dbc3e9;
}
</style>
<script>
    document.write("<table align='center'>");
    for (let i = 0; i <= 9; i++) {
        document.write("<tr>");
        for (let j = 0; j <= i ; j++) {
            document.write("<td>");
            document.write(i + " * " + j + " = " + (i * j) + "&nbsp;&nbsp;&nbsp;");
            document.write("</td>");
        }
        document.write("</tr>");
    }
    document.write("</table>");
</script>
 </head>
</body>
</html>
